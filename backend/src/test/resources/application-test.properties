# Os limites de producao (5 logins/15min) barrariam a propria suite:
# cada teste autentica. Aqui a janela e folgada de proposito.
vidareal.seguranca.login.limite=1000
vidareal.seguranca.chat.limite=1000

# Banco em memoria, descartado ao fim da suite: os testes criam e excluem
# registros e nao podem tocar no banco de desenvolvimento.
spring.datasource.url=jdbc:h2:mem:vidareal-test;DB_CLOSE_DELAY=-1
