# ---------------------------------------------------------------
# VidaReal API - configuracao da aplicacao
# ---------------------------------------------------------------

spring.application.name=vidareal-api
server.port=${PORT:3001}

# Devolve 404 pelo tratador global em vez da pagina de erro padrao
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ---------------------------------------------------------------
# Banco de dados
# ---------------------------------------------------------------
# H2 em modo arquivo: o banco vive em backend/data/vidareal.mv.db e
# sobrevive ao reinicio da API. Aponte VIDAREAL_DB_URL para um servidor
# (Oracle, PostgreSQL) e nada mais precisa mudar no codigo.
spring.datasource.url=${VIDAREAL_DB_URL:jdbc:h2:file:./data/vidareal}
spring.datasource.username=${VIDAREAL_DB_USER:sa}
spring.datasource.password=${VIDAREAL_DB_PASSWORD:}

# Cria as tabelas na subida a partir de schema.sql. O script usa
# "IF NOT EXISTS", entao rodar sempre e seguro e nao apaga nada.
spring.sql.init.mode=always

# Datas em ISO 8601 (padrao REST), nunca em timestamp numerico
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# Limite do corpo da requisicao: evita que um envio gigante consuma memoria
server.tomcat.max-http-form-post-size=100KB

# Log tecnico das requisicoes (metodo, rota, status) - diferente da
# trilha de auditoria, que registra quem fez o que
logging.level.br.gov.taubate.vidareal=INFO

# Origens autorizadas a chamar a API (front-end)
vidareal.origens-permitidas=http://localhost:5173,http://127.0.0.1:5173

# Assistente virtual: a chave vem da variavel de ambiente IA_API_KEY
vidareal.ia.modelo=gemini-3-flash-preview
