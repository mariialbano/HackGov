# ---------------------------------------------------------------
# VidaReal API - configuracao da aplicacao
# ---------------------------------------------------------------

spring.application.name=vidareal-api
server.port=${PORT:3001}

# Devolve 404 pelo tratador global em vez da pagina de erro padrao
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ---------------------------------------------------------------
# Banco de dados
# ---------------------------------------------------------------
# H2 em modo arquivo: o banco vive em backend/data/vidareal.mv.db e
# sobrevive ao reinicio da API. Aponte VIDAREAL_DB_URL para um servidor
# (Oracle, PostgreSQL) e nada mais precisa mudar no codigo.
spring.datasource.url=${VIDAREAL_DB_URL:jdbc:h2:file:./data/vidareal}
spring.datasource.username=${VIDAREAL_DB_USER:sa}
spring.datasource.password=${VIDAREAL_DB_PASSWORD:}

# Cria as tabelas na subida a partir de schema.sql. O script usa
# "IF NOT EXISTS", entao rodar sempre e seguro e nao apaga nada.
spring.sql.init.mode=always

# Datas em ISO 8601 (padrao REST), nunca em timestamp numerico
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# Limite do corpo da requisicao: evita que um envio gigante consuma memoria
server.tomcat.max-http-form-post-size=100KB

# Log tecnico das requisicoes (metodo, rota, status) - diferente da
# trilha de auditoria, que registra quem fez o que
logging.level.br.gov.taubate.vidareal=INFO

# Origens autorizadas a chamar a API (front-end)
vidareal.origens-permitidas=http://localhost:5173,http://127.0.0.1:5173

# Assistente virtual: a chave vem da variavel de ambiente IA_API_KEY
vidareal.ia.modelo=gemini-3-flash-preview

# Triagem inteligente: consultas de sugestao por minuto, por IP. A tela
# consulta enquanto o cidadao digita, por isso o limite e mais folgado.
vidareal.seguranca.triagem.limite=60

# ---------------------------------------------------------------
# Recuperacao de senha
# ---------------------------------------------------------------
# O link de redefinicao chega ao cidadao por e-mail (configuracao abaixo).
vidareal.recuperacao.validade-minutos=15
# Endereco do front-end, usado para montar o link do e-mail
vidareal.recuperacao.url-base=http://localhost:5173
# Toda solicitacao demora pelo menos isto, exista a conta ou nao
vidareal.recuperacao.tempo-minimo-ms=400
# Pedidos e tentativas de redefinicao por IP, na mesma janela do login
vidareal.seguranca.recuperacao.limite=10

# ---------------------------------------------------------------
# E-mail (SMTP)
# ---------------------------------------------------------------
# As credenciais vem de variaveis de ambiente, definidas em backend/.env
# (modelo em .env.example). Sem SMTP_HOST a API sobe normalmente e apenas a
# recuperacao de senha responde "indisponivel".
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
# STARTTLS: a conversa com o servidor e criptografada antes de a senha ser
# enviada. Obrigatorio por padrao; so um servidor local de testes o dispensa.
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
# Sem estes limites, um servidor SMTP que nao responde prenderia a fila de envio
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Endereco que aparece como remetente. No Gmail precisa ser a propria conta.
vidareal.email.remetente=${SMTP_FROM:${SMTP_USER:}}

# E-mails das contas de demonstracao. O dominio example.com e reservado e
# nunca entrega: para receber de verdade, defina um endereco seu no .env.
vidareal.demo.email-cidadao=${DEMO_EMAIL_CIDADAO:maria.silva@example.com}
vidareal.demo.email-atendente=${DEMO_EMAIL_ATENDENTE:joao.santos@example.com}
