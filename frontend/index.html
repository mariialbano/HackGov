<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackGov VidaReal</title>
  </head>
  <body class="bg-gov-bg">
    <div id="root"></div>

    <!-- VLibras: estrutura obrigatória do widget oficial do governo -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      // Padrão oficial: instanciar direto (o plugin aguarda o load da página
      // internamente — envolver em window.onload impede a inicialização).
      try {
        new window.VLibras.Widget('https://vlibras.gov.br/app');
      } catch (e) {
        console.error('VLibras falhou ao carregar, mas a aplicação continua.', e);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
