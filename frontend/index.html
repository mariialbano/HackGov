<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icone da aba. O .ico vem primeiro como base compativel com todo
         navegador; quem entende SVG na aba prefere o vetor, que fica nitido
         em tela de alta densidade. O ?v=2 evita o cache agressivo de favicon. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#ff8101" />
    <meta name="description" content="VidaReal - transparencia publica e educacao financeira para o cidadao de Taubate/SP." />
    <title>VidaReal</title>
  </head>
  <body class="bg-gov-bg">
    <div id="root"></div>

    <!-- VLibras, tradutor de Libras do governo federal.
         A partir da versao 7 o plugin monta sozinho o proprio elemento
         (#vlibras-access-wrapper, com shadow DOM) no body: a antiga
         estrutura <div vw> nao e mais usada. Ele fica oculto por padrao
         via CSS (ver index.css) e o botao na barra superior alterna. -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
